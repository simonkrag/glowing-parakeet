<title>Modtagekontrol - GRUMS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap');
:root {
  --bg: #0a0a0a; --fg: #e8e4df; --accent: #c4a35a; --card: #161616;
  --border: #2a2a2a; --muted: #777; --danger: #f87171; --success: #4ade80;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f5f2ed; --fg: #1a1a1a; --accent: #8b6914; --card: #fff; --border: #ddd; --muted: #888; }
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body {
  font-family: 'DM Sans', -apple-system, sans-serif; background: var(--bg); color: var(--fg);
  min-height: 100vh; min-height: 100dvh;
  padding: calc(16px + var(--safe-top)) 16px calc(16px + var(--safe-bottom));
  -webkit-font-smoothing: antialiased;
}
h1 { font-family: 'DM Serif Display', serif; font-size: 26px; margin-bottom: 2px; }
.subtitle { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; }
.btn {
  background: var(--accent); color: #0a0a0a; border: none; padding: 14px 24px; border-radius: 10px;
  font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; width: 100%;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: opacity .15s; -webkit-appearance: none; text-decoration: none;
}
.btn:active { opacity: .7; }
.btn:disabled { opacity: .35; }
.btn-outline { background: transparent; color: var(--fg); border: 1px solid var(--border); }
.btn-green { background: #16a34a; color: white; }
.btn-sm { padding: 10px 16px; font-size: 13px; margin-top: 10px; }
.upload-zone {
  border: 2px dashed var(--border); border-radius: 14px; padding: 44px 20px;
  text-align: center; cursor: pointer; transition: border-color .2s;
}
.upload-zone:active { border-color: var(--accent); }
.upload-zone .icon { font-size: 36px; margin-bottom: 8px; }
.upload-zone .label { font-weight: 600; font-size: 15px; }
.ingredient-highlight {
  background: var(--bg); border-radius: 10px; padding: 14px; margin-bottom: 14px;
}
.ingredient-highlight .meta { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.ingredient-highlight .name { font-size: 20px; font-weight: 700; }
.ingredient-highlight .qty { font-size: 14px; color: var(--muted); margin-top: 2px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 8px 10px; border-bottom: 2px solid var(--border); color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .4px; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.mono { font-family: 'SF Mono', 'Courier New', monospace; font-size: 12px; }
.pill { display: inline-block; padding: 2px 9px; border-radius: 99px; font-size: 11px; font-weight: 600; }
.pill-done { background: #1a3a1a; color: #4ade80; }
.pill-wait { background: #3a2a0a; color: var(--accent); }
.pill-active { background: #0a2a3a; color: #60a5fa; }
@media (prefers-color-scheme: light) {
  .pill-done { background: #dcfce7; color: #166534; }
  .pill-wait { background: #fef3c7; color: #92400e; }
  .pill-active { background: #dbeafe; color: #1e40af; }
}
.alert { border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; font-size: 13px; }
.alert-error { background: #3a1a1a; border: 1px solid #6b2020; color: var(--danger); }
.alert-success { background: #1a3a1a; border: 1px solid #166534; color: var(--success); }
@media (prefers-color-scheme: light) {
  .alert-error { background: #fef2f2; border-color: #fca5a5; color: #b91c1c; }
  .alert-success { background: #dcfce7; border-color: #86efac; color: #166534; }
}
.info-row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 6px; font-size: 13px; }
.info-row span { color: var(--muted); }
.loading { text-align: center; padding: 28px; }
.spinner {
  display: inline-block; width: 22px; height: 22px; border: 2.5px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite;
  vertical-align: middle; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg) } }
.preview { max-width: 100%; max-height: 180px; border-radius: 10px; margin-top: 10px; object-fit: contain; display: block; margin-left: auto; margin-right: auto; }
.counter { font-size: 13px; color: var(--muted); }
.done-icon { font-size: 48px; margin-bottom: 8px; }
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px;
  background: var(--bg); color: var(--fg); font-family: inherit; font-size: 13px; outline: none;
  -webkit-appearance: none;
}
input[type="text"]:focus, input[type="password"]:focus,
input[type="number"]:focus, select:focus, textarea:focus { border-color: var(--accent); }
input[type="file"] { display: none; }
textarea { resize: vertical; min-height: 80px; font-family: 'SF Mono','Courier New',monospace; font-size: 12px; }
.flex-row { display: flex; gap: 8px; flex-wrap: wrap; }
.flex-row > * { flex: 1; min-width: 120px; }
.lbl { font-size: 12px; color: var(--muted); display: block; margin: 10px 0 4px; }
.manual-row {
  display: grid; grid-template-columns: 80px 1fr 56px 48px 28px;
  gap: 4px; margin-bottom: 6px; align-items: center;
}
.manual-row select, .manual-row input { padding: 9px 6px; font-size: 12px; }
.m-remove {
  background: transparent; color: var(--danger); border: 1px solid var(--border);
  border-radius: 8px; cursor: pointer; padding: 6px; font-size: 18px; line-height: 1;
  height: 100%;
}
.divider {
  text-align: center; color: var(--muted); font-size: 11px; margin: 14px 0;
  text-transform: uppercase; letter-spacing: 1px;
}
.divider::before, .divider::after {
  content: ""; display: inline-block; width: 30%; height: 1px; background: var(--border);
  vertical-align: middle; margin: 0 8px;
}
</style>
</head>
<body>
<div id="app" style="max-width:480px;margin:0 auto;">
  <h1>Modtagekontrol</h1>
  <p class="subtitle">GRUMS ApS - helsebixen.dk</p>
  <div id="alert-box"></div>
  <div id="view-setup"></div>
  <div id="view-delivery"></div>
  <div id="view-manual"></div>
  <div id="view-labels"></div>
  <div id="view-done"></div>
  <details id="diag-panel" style="margin-top:24px;font-size:11px;color:var(--muted);">
    <summary style="cursor:pointer;padding:8px 0;">🔧 Diagnostik (åbn hvis noget ikke virker)</summary>
    <div id="diag-log" style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px;font-family:'SF Mono','Courier New',monospace;font-size:11px;max-height:240px;overflow-y:auto;white-space:pre-wrap;word-break:break-word;"></div>
    <div style="display:flex;gap:6px;margin-top:6px;">
      <button class="btn btn-outline btn-sm" style="margin:0;" onclick="document.getElementById('diag-log').innerHTML=''">Ryd</button>
      <button class="btn btn-outline btn-sm" style="margin:0;" onclick="testApi()">Test API-nøgle</button>
    </div>
  </details>
</div>
<script>
const SHEET_ID = '1FbZBfFw68-4HysGFlvXdJ1Ar8M7Ha3tJD2Pf0lsJ_-o';
const SCRIPT_URL = 'https://script.google.com/a/macros/grumsaarhus.com/s/AKfycbwhyon4kiKbu0_C3iY15_3Rtc-5-OYNCZccvRmhFYmEgdRuRSVdOZ3wlUHt28ifxeokVg/exec';
const LS_API_KEY = 'grums_api_key';
let state = {
  apiKey: localStorage.getItem(LS_API_KEY) || '',
  deliveryInfo: null,
  ingredients: [],
  currentIdx: 0,
  sheetWritten: false,
};
function $(id) { return document.getElementById(id); }
function showAlert(msg, type) {
  $('alert-box').innerHTML = msg ? `<div class="alert alert-${type}">${msg}</div>` : '';
}
// ===== Diagnostik =====
function diag(msg, kind) {
  try {
    const box = document.getElementById('diag-log');
    if (!box) { console.log('[DIAG]', msg); return; }
    const t = new Date().toTimeString().slice(0,8);
    const color = kind === 'err' ? 'var(--danger)' : kind === 'ok' ? 'var(--success)' : 'var(--fg)';
    const line = document.createElement('div');
    line.style.cssText = 'border-bottom:1px solid var(--border);padding:4px 0;color:' + color;
    line.textContent = t + '  ' + msg;
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  } catch(e) {}
  console.log('[DIAG]', msg);
}
window.addEventListener('error', function(e) {
  diag('JS-fejl: ' + (e.message || e) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''), 'err');
});
window.addEventListener('unhandledrejection', function(e) {
  diag('Unhandled promise: ' + (e.reason?.message || e.reason || 'ukendt'), 'err');
});
async function testApi() {
  if (!state.apiKey) { diag('Ingen API-nøgle gemt', 'err'); return; }
  diag('Tester API-nøgle...');
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': state.apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-5',
        max_tokens: 10,
        messages: [{ role: 'user', content: 'ping' }]
      })
    });
    diag('API svarede: ' + res.status + ' ' + res.statusText, res.ok ? 'ok' : 'err');
    if (!res.ok) {
      const err = await res.text();
      diag('Detalje: ' + err.substring(0, 200), 'err');
    }
  } catch (e) {
    diag('Netværksfejl: ' + e.message, 'err');
  }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function todayDDMMYYYY() {
  const d = new Date();
  return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
}
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res({ data: r.result.split(',')[1], mediaType: file.type });
    r.onerror = () => rej(new Error('Read failed'));
    r.readAsDataURL(file);
  });
}
async function callClaude(base64, mediaType, prompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': state.apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1000,
      messages: [{
        role: 'user',
        content: [
          { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
          { type: 'text', text: prompt }
        ]
      }]
    })
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || 'API fejl: ' + res.status);
  }
  const data = await res.json();
  const raw = data.content?.[0]?.text || '';
  return raw.replace(/```json|```/g, '').trim();
}
async function writeToSheet(rows) {
  const data = encodeURIComponent(JSON.stringify({ rows }));
  const url = SCRIPT_URL + '?data=' + data;
  debugLog('URL længde: ' + url.length);
  debugLog('Request URL: ' + url.substring(0, 120) + '...');
  try {
    debugLog('Sender GET request...');
    const res = await fetch(url, { redirect: 'follow' });
    debugLog('Response status: ' + res.status + ' ' + res.statusText);
    debugLog('Response type: ' + res.type);
    debugLog('Response URL: ' + res.url);
    const text = await res.text();
    debugLog('Response body: ' + text.substring(0, 200));
    return JSON.parse(text);
  } catch (err) {
    debugLog('Fetch fejl: ' + err.name + ': ' + err.message);
    debugLog('Stack: ' + err.stack);
    debugLog('Prøver script-tag fallback...');
    return new Promise((resolve, reject) => {
      const callbackName = 'sheetCallback_' + Date.now();
      const scriptUrl = url + '&callback=' + callbackName;
      window[callbackName] = (result) => {
        debugLog('Script callback modtaget');
        delete window[callbackName];
        document.body.removeChild(script);
        resolve(result);
      };
      const script = document.createElement('script');
      script.src = scriptUrl;
      script.onerror = (e) => {
        debugLog('Script-tag fejl: ' + JSON.stringify(e));
        delete window[callbackName];
        document.body.removeChild(script);
        reject(new Error('Begge metoder fejlede'));
      };
      document.body.appendChild(script);
      setTimeout(() => {
        if (window[callbackName]) {
          debugLog('Script timeout efter 15s');
          delete window[callbackName];
          try { document.body.removeChild(script); } catch(x) {}
          reject(new Error('Timeout'));
        }
      }, 15000);
    });
  }
}
function debugLog(msg) {
  console.log('[DEBUG] ' + msg);
  var box = $('debug-box');
  if (box) {
    box.innerHTML += '<div style="border-bottom:1px solid var(--border);padding:4px 0;">' + msg + '</div>';
    box.scrollTop = box.scrollHeight;
  }
}
function hideAll() {
  ['view-setup','view-delivery','view-manual','view-labels','view-done'].forEach(id => $(id).innerHTML = '');
  showAlert('', '');
}
function showSetup() {
  hideAll();
  $('view-setup').innerHTML = `
    <div class="card">
      <h2 style="font-size:17px;margin-bottom:6px;">Opsætning</h2>
      <p style="color:var(--muted);font-size:12px;margin-bottom:14px;">
        Indtast din Anthropic API-nøgle. Den gemmes kun lokalt på denne enhed.
        Find den på <a href="https://console.anthropic.com/settings/keys" target="_blank" style="color:var(--accent);">console.anthropic.com</a>
      </p>
      <label class="lbl">API-nøgle:</label>
      <input type="password" id="api-key-input" placeholder="sk-ant-..." value="${escapeHtml(state.apiKey)}">
      <button class="btn" style="margin-top:12px;" onclick="saveApiKey()">Gem og fortsæt</button>
    </div>`;
}
function saveApiKey() {
  const key = $('api-key-input').value.trim();
  if (!key.startsWith('sk-')) {
    showAlert('API-nøgle skal starte med sk-', 'error');
    return;
  }
  state.apiKey = key;
  localStorage.setItem(LS_API_KEY, key);
  showDelivery();
}
function showDelivery() {
  hideAll();
  $('view-delivery').innerHTML = `
